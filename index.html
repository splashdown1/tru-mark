<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141a">
<title>TRU MARK</title>
<style>
:root{--bg:#10141a;--ink:#e6eef6;--dim:#9aabbc;--line:#243040;--sky:#8eb7d6;--card:#18202a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--sky)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c1016;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--sky);color:#10141a;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
.chips{display:flex;gap:6px;overflow:auto;padding:0 16px 8px} .chips button{background:#1c2632;color:var(--ink);font-weight:normal;border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px}
.chips button.on{border-color:var(--sky);color:var(--sky)}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--sky);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>MARK</span></h1><p class="sub">Find north and measure a walk. No GPS. No invented declination.</p></header>
<div class="bar"><input id="q" placeholder="north, pace, scale, latitude…"><button id="send">Send</button></div>
<div class="chips" id="chips"></div>
<main id="out"></main>
<script>
const LANES=["NORTH","PACE","SCALE","NIGHT"];
const CARDS={
NORTH:[
{t:"Shadow stick",d:"Level ground, straight stick, sunny day. Mark the tip of the shadow. Wait 15 minutes. Mark the tip again. The line from the first mark to the second is west to east. First mark is west. Stand with west on your left: you face north. This is the sun's motion, not a compass correction."},
{t:"Watch is not packed",d:"The old watch-face method needs a known local solar offset and fails near noon and in the tropics. This card does not teach it."},
{t:"Declination is local",d:"A compass needle points to magnetic north, not the map's north. The angle between them is declination, and it changes by place and year. This page will not guess your declination. Read it off the map legend before you trust a bearing."}
],
PACE:[
{t:"Count your own",d:"A pace here is two steps, left foot to left foot. On a known 100 meters, walk naturally and count. That number is yours. Uphill, brush, and a load shorten it. Do not borrow 60 paces to 100 meters unless you measured it."},
{t:"Mile from a measured pace",d:"If you counted P paces on 100 meters, a kilometer is 10 times that count. A statute mile is 1.609 kilometers, so mile paces = P × 16.09. Round after you measure P. The page will not supply P."}
],
SCALE:[
{t:"Representative fraction",d:"1:50,000 means 1 unit on the map is 50,000 of the same unit on the ground. 1 cm on that map is 500 m. 1 inch is 50,000 inches, about 0.79 mile."},
{t:"1:24,000",d:"A common US topographic scale. 1 inch on the map is 2,000 feet on the ground. 1 cm is 240 m."},
{t:"1:25,000",d:"1 cm on the map is 250 m on the ground. 1 inch is about 0.39 mile."}
],
NIGHT:[
{t:"Polaris",d:"Find the Big Dipper. The two stars at the outer edge of the cup point to the next bright star along that line, about five times the gap between them. That star is Polaris. It sits almost on the north celestial pole. Face it and you face north."},
{t:"Latitude from Polaris",d:"In the northern hemisphere, the height of Polaris above the horizon, in degrees, is about your latitude. On the Gulf Coast that is near 30 degrees, a third of the way from horizon to zenith. It is not a survey."},
{t:"South is a gap",d:"The Southern Cross method is not packed here. If you cannot see Polaris, say so and use the sun method by day."}
]};
let lane="NORTH";
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(k,t,d){return `<article class="card"><div class="k">${esc(k)}</div><div class="big">${esc(t)}</div><div>${esc(d)}</div><div class="src">Standard field navigation. Declination and your pace are measured, not stored.</div></article>`;}
function render(){document.getElementById("out").innerHTML=CARDS[lane].map(x=>card(lane,x.t,x.d)).join("");}
function search(q){
  q=(q||"").trim().toLowerCase(); if(!q){render();return;}
  const hits=[];
  Object.entries(CARDS).forEach(([k,arr])=>arr.forEach(x=>{if((x.t+" "+x.d).toLowerCase().includes(q)) hits.push(card(k,x.t,x.d));}));
  if(/^\d+(\.\d+)?$/.test(q)){
    const n=parseFloat(q);
    hits.unshift(card("SCALE",n+" cm on 1:50,000",(n*500)+" meters on the ground."));
  }
  document.getElementById("out").innerHTML=hits.length?hits.join(""):card("GAP","No packed mark","Nothing in north, pace, scale, or night matches that. This page will not invent a bearing.");
}
document.getElementById("chips").innerHTML=LANES.map(l=>`<button data-l="${l}" class="${l===lane?"on":""}">${l}</button>`).join("");
document.getElementById("chips").onclick=e=>{const b=e.target.closest("button"); if(!b) return; lane=b.dataset.l; [...document.getElementById("chips").children].forEach(x=>x.classList.toggle("on",x===b)); render();};
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
render();
</script>
</body>
</html>
